<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found | Stackly Bank</title>

<style>
/* ==== GLOBAL ==== */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

body{
    height:100vh;
    width:100%;
    overflow:hidden;
    background:#3b0000; /* deep brown-red */
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
}

/* ==== BACKGROUND ANIMATION ==== */
.bg-circles div{
    position:absolute;
    border-radius:50%;
    background:rgba(231,18,40,0.15);
    animation:float 8s linear infinite;
}

.bg-circles div:nth-child(1){
    width:120px;height:120px;
    top:10%;left:15%;
    animation-duration:9s;
}
.bg-circles div:nth-child(2){
    width:180px;height:180px;
    bottom:15%;right:12%;
    animation-duration:7s;
}
.bg-circles div:nth-child(3){
    width:90px;height:90px;
    top:55%;left:32%;
    animation-duration:6s;
}

@keyframes float{
    0%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-25px) rotate(25deg);}
    100%{transform:translateY(0) rotate(0deg);}
}

/* ==== CONTAINER ==== */
.container{
    position:relative;
    text-align:center;
    max-width:700px;
    padding:20px;
    z-index:2;
}

/* ==== LOGO ==== */
.logo-box{
    display:flex;
    justify-content:center;
    margin-bottom:20px;
}
.logo{
    width:170px;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,0.4));
}

/* ==== 404 TEXT ==== */
.big-404{
    font-size:120px;
    font-weight:900;
    letter-spacing:5px;
    background:linear-gradient(45deg,#ffffff,#E71228);
    -webkit-background-clip:text;
    color:transparent;
    animation:glow 2s infinite ease-in-out;
}

@keyframes glow{
    0%{text-shadow:0 0 10px rgba(255,255,255,0.3);}
    100%{text-shadow:0 0 25px rgba(255,255,255,0.8);}
}

/* ==== MESSAGE ==== */
.oops{
    font-size:28px;
    font-weight:600;
    margin-top:-10px;
}
.desc{
    margin-top:10px;
    font-size:16px;
    color:#ffe0e0;
}

/* ==== BUTTON ==== */
.back-btn{
    margin-top:30px;
    background:#E71228;
    border:none;
    padding:14px 28px;
    color:#fff;
    font-size:16px;
    font-weight:700;
    border-radius:8px;
    cursor:pointer;
    transition:.3s;
}

.back-btn:hover{
    background:#b30000;
    transform:translateY(-3px);
}

/* ==== RESPONSIVE ==== */
@media(max-width:650px){
    .big-404{font-size:85px;}
    .oops{font-size:22px;}
    .logo{width:140px;}
}
</style>
</head>

<body>

<!-- ANIMATED BACKGROUND -->
<div class="bg-circles">
    <div></div><div></div><div></div>
</div>

<!-- PAGE CONTENT -->
<div class="container">

    <!-- USE YOUR OWN WHITE LOGO HERE -->
    <div class="logo-box">
        <img src="Images/logo_new.webp" class="logo" alt="Stackly Bank Logo">
    </div>

    <div class="big-404">404</div>

    <div class="oops">Oops! Page Not Found</div>

    <div class="desc">
        The page you are looking for might have been removed,<br>
        had its name changed or is temporarily unavailable.
    </div>

    <button class="back-btn" onclick="location.href='index.html'">
        Go Back Home
    </button>

</div>

</body>
</html>
