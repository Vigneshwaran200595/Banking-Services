<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>404 - Bank Page Not Found</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ================= GLOBAL ================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI",Arial;
}

body{
  background:#f7f5f5;
  color:#3B0000;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  position:relative;
}

/* ================= CIRCLE ANIMATIONS ================= */
.circle{
  position:absolute;
  border-radius:50%;
  background:rgba(231,18,40,0.12);
  animation:float 6s infinite ease-in-out;
}

.circle.small{ width:80px;height:80px; top:10%; left:12%; }
.circle.medium{ width:130px;height:130px; bottom:15%; right:10%; animation-duration:7s; }
.circle.large{ width:200px;height:200px; top:55%; left:-80px; animation-duration:9s; }

@keyframes float{
  0%{ transform:translateY(0); }
  50%{ transform:translateY(-25px); }
  100%{ transform:translateY(0); }
}

/* ================= 404 CONTAINER ================= */
.container{
  z-index:5;
  text-align:center;
  padding:20px;
  max-width:580px;
}

.logo{
  width:150px;
  margin:0 auto 20px auto;
  display:block;
}

.big-text{
  font-size:110px;
  font-weight:900;
  color:#E71228;
  text-shadow:0 6px 22px rgba(0,0,0,0.15);
  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%,100%{ transform:scale(1); }
  50%{ transform:scale(1.04); }
}

.sub-title{
  font-size:22px;
  margin-top:10px;
  font-weight:700;
}

.message{
  margin-top:12px;
  font-size:16px;
  color:#555;
}

/* ================= BUTTON ================= */
.home-btn{
  background:#E71228;
  color:#fff;
  padding:12px 26px;
  display:inline-block;
  margin-top:32px;
  border-radius:8px;
  font-size:17px;
  font-weight:700;
  border:none;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:0.3s;
}

.home-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 18px rgba(231,18,40,0.4);
}

.home-btn::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  top:0;
  left:-100%;
  background:#8B0000;
  z-index:-1;
  transition:0.35s ease;
}

.home-btn:hover::before{
  left:0;
}

/* ================= RESPONSIVE ================= */
@media(max-width:520px){
  .big-text{ font-size:80px; }
  .logo{ width:110px; }
}
</style>
</head>

<body>

<!-- Floating background elements -->
<div class="circle small"></div>
<div class="circle medium"></div>
<div class="circle large"></div>

<!-- MAIN CONTENT -->
<div class="container">

    <!-- Replace logo with your own -->
    <img src="Images/logo.webp" class="logo" alt="Bank Logo">

    <div class="big-text">404</div>

    <div class="sub-title">Page Not Found</div>

    <p class="message">
        Oops! The page you’re looking for doesn’t exist.<br>
        It may have been moved or deleted.
    </p>

    <button class="home-btn" onclick="goHome()">Back to Home</button>
</div>

<script>
function goHome(){
  window.location.href = "index.html"; // change if needed
}
</script>

</body>
</html>
